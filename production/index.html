/* =========================================================
   עיצוב: אותם צבעים ופונטים כמו באתר ההרשמה ובאתר המשתתפים.
   שני מסכים באותו קובץ: חדר הבקרה (ברירת מחדל) ומסך ההקרנה (?view=screen).
   ========================================================= */
:root {
  --bg: #eef0f5; --fg: #0a0c12; --muted: #5a6273; --line: #d3d8e3; --dot: #c3cad9;
  --accent: #1f4dff; --accent-soft: #e3e9ff; --accent-fg: #ffffff;
  --panel: #ffffff; --panel-fg: #0a0c12; --panel-muted: #687083; --panel-line: #d9dde6; --panel-dot: #e4e8f0; --panel-error: #d32f2f;
  --live: #0f9d58; /* מצב "פתוח עכשיו" בלבד */

  --font-body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-dot: "Doto", "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #06080d; --fg: #eef1f7; --muted: #8a93a6; --line: #222a39; --dot: #1b2231;
    --accent: #4f7bff; --accent-soft: #141d36; --accent-fg: #06080d;
    --panel: #0d111a; --panel-fg: #eef1f7; --panel-muted: #8790a3; --panel-line: #262d3b; --panel-dot: #1a2030; --panel-error: #ff8080;
    --live: #3ddc84;
    color-scheme: dark;
  }
}
/* מסך ההקרנה תמיד כהה, בלי קשר להגדרות המחשב */
body.screen {
  --bg: #06080d; --fg: #eef1f7; --muted: #8a93a6; --line: #222a39; --dot: #161c29;
  --accent: #4f7bff; --accent-soft: #141d36; --accent-fg: #06080d;
  --panel: #0d111a; --panel-fg: #eef1f7; --panel-muted: #8790a3; --panel-line: #262d3b; --panel-dot: #161c28;
  --live: #3ddc84;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.dotfont { font-family: var(--font-dot); font-weight: 900; letter-spacing: .02em; direction: ltr; unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; }
.dotgrid { background-image: radial-gradient(var(--dot) 1.2px, transparent 1.4px); background-size: 22px 22px; background-position: center; }
.textured { background-color: var(--panel); background-image: radial-gradient(var(--panel-dot) 1px, transparent 1.3px); background-size: 14px 14px; }
.dot-canvas { display: none; touch-action: pan-y; max-width: 100%; }
.dotted .dot-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.dotted .dot-canvas { display: block; }
[hidden] { display: none !important; }

.page { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 1200px; margin-inline: auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

.brandbar { display: flex; align-items: center; gap: 18px; padding-block: max(18px, env(safe-area-inset-top, 0px)) 8px; }

<body>
<div class="page dotgrid" id="page">
  <div class="wrap" id="brand">
    <div class="brandbar">
      <span class="mini-logo" role="img" aria-label="אוניברסיטת תל אביב"></span>
      <span class="brand-divider" aria-hidden="true"></span>
      <p class="org"><strong>החוג לתקשורת ע"ש דן</strong>הפקולטה לניהול ע"ש קולר</p>
      <span class="spacer"></span>
      <span class="tag dotfont" id="tag">AI × JOURNALISM 2026</span>
    </div>
  </div>
  <div id="root" class="pj-root" style="flex:1;display:flex;flex-direction:column"></div>
  <footer id="foot">החוג לתקשורת ע"ש דן · הפקולטה לניהול ע"ש קולר · אוניברסיטת תל אביב</footer>
</div>

<script>
/* =========================================================
   כתובת ה-Web App של סקריפט הסקר (אותה כתובת כמו באתר המשתתפים).
   כל עוד היא לא מוגדרת, האתר עובד במצב תצוגה עם נתוני דוגמה.
   ========================================================= */
const SCRIPT_URL = "PASTE_SURVEY_WEB_APP_URL_HERE";
const PARTICIPANT_URL = "YOUR-SITE.example/survey"; // מוצג על המסך למי שרוצה להקליד ידנית

const DEMO = !/^https:\/\/script\.google\.com\//.test(SCRIPT_URL);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cssVar = n => getComputedStyle(document.body).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const fmt = ms => { ms = Math.max(0, ms); return pad(Math.floor(ms / 60000)) + ":" + pad(Math.floor(ms / 1000) % 60); };
let SCREEN = new URLSearchParams(location.search).get("view") === "screen" || location.hash === "#screen";
const KEY_STORE = "survey-admin-key";
const root = $("root");

let key = ""; try { key = localStorage.getItem(KEY_STORE) || ""; } catch (e) {}
let S = null, clockOffset = 0, busy = false, msg = "";
let pollTimer = 0, tickTimer = 0;
const ui = { previewStage: "", dim: "all", group: "all", min: {}, ana: { stage: "", qid: "", dim: "role", consent: false } };
let lastSig = "";
const now = () => Date.now() + clockOffset;

/* =========================================================
   תקשורת עם הסקריפט
   ========================================================= */
async function api(action, params = {}, post = false) {
  if (DEMO) return mock(action, params);
  const body = new URLSearchParams({ action, key, ...params });
  const r = post ? await fetch(SCRIPT_URL, { method: "POST", body }) : await fetch(SCRIPT_URL + "?" + body, { cache: "no-store" });
  return r.json();
}
async function load() {
  clearTimeout(pollTimer);
  if (!key && !DEMO) { renderLogin(); return; }
  try {
    const res = await api("admin");
    if (!res.ok) { if (res.error === "auth") { forget(); renderLogin("המפתח לא נכון. נסו שוב."); return; } throw new Error(res.error); }
    take(res); msg = "";
  } catch (e) { msg = "אין חיבור לשרת הסקר. מנסים שוב…"; }
  render();
  pollTimer = setTimeout(load, document.visibilityState === "visible" ? 4000 : 15000);
}
function take(res) { S = res; clockOffset = res.serverNow - Date.now(); }
function forget() { key = ""; try { localStorage.removeItem(KEY_STORE); } catch (e) {} }
async function control(params) {
  if (busy) return; busy = true; render();
  try {
    const res = await api("control", params, true);
    if (res.ok) take(res);
    else msg = res.error === "auth" ? "המפתח לא תקף" : res.error === "bad_stage" ? "לשלב הזה אין שאלות בגיליון." : "הפעולה לא בוצעה. נסו שוב.";
  } catch (e) { msg = "הפעולה לא הגיעה לשרת. בדקו את החיבור ונסו שוב."; }
  busy = false; render();
}

/* =========================================================
   חישובים
   ========================================================= */
const isOpen = () => S && S.control.activeStage && now() < S.control.closesAt;
const stageById = id => S.stages.find(s => s.id === id);
const rowsOf = id => S.rows.filter(r => r[1] === id);
const respondents = id => new Set(rowsOf(id).map(r => r[0])).size;
function stageStatus(s) {
  if (isOpen() && S.control.activeStage === s.id) return ["live", "Open now"];
  if (S.control.history[s.id] || respondents(s.id)) return ["done", "Closed"];
  return ["", "Not opened"];
}
// מה יוצג על המסך עכשיו
function screenMode() {
  const c = S.control, st = stageById(c.screenStage || c.activeStage);
  if (!st || c.screen === "idle") return { mode: "idle" };
  if (c.screen === "live" && isOpen() && c.activeStage === st.id) return { mode: "live", stage: st };
  return { mode: "results", stage: st };
}
function groupsOf(stageId, dim) {
  if (dim === "all") return [];
  const idx = dim === "role" ? 4 : 5, seen = new Map();
  for (const r of rowsOf(stageId)) { const g = r[idx] || "לא צוין"; if (!seen.has(r[0] + g)) seen.set(r[0] + g, g); }
  const counts = {}; for (const g of seen.values()) counts[g] = (counts[g] || 0) + 1;
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([g]) => g);
}
function filtered(stageId) {
  let rows = rowsOf(stageId);
  if (ui.dim !== "all" && ui.group !== "all") { const idx = ui.dim === "role" ? 4 : 5; rows = rows.filter(r => (r[idx] || "לא צוין") === ui.group); }
  return rows;
}

function charts(stage, rows, big) {
  return stage.questions.map((q, i) => {
    const vals = rows.filter(r => r[2] === q.id).map(r => r[3]);
    const head = big ? `<span class="mono">Q${pad(i + 1)} · ${vals.length} answers</span><h3>${esc(q.text)}</h3>` : `<h4>${esc(q.text)}</h4>`;
    let body;
    if (!vals.length) body = `<p class="empty">עדיין אין תשובות</p>`;
    else if (q.type === "scale") {
      const nums = vals.map(Number), counts = [1, 2, 3, 4, 5].map(n => nums.filter(v => v === n).length), max = Math.max(1, ...counts);
      const mean = nums.reduce((a, b) => a + b, 0) / nums.length;
      body = `<div class="mean"><b>${mean.toFixed(1)}</b><span>ממוצע מתוך 5</span></div>
        <div class="dist">${counts.map((c, k) => `<div><span class="n">${c}</span><i style="height:${c / max * 100}%"></i><span>${k + 1}</span></div>`).join("")}</div>
        <div class="ends"><span>1 · ${esc(q.min || "בכלל לא")}</span><span>5 · ${esc(q.max || "במידה רבה מאוד")}</span></div>`;
    } else {
      const counts = q.options.map(o => ({ o, n: vals.filter(v => v === o).length })), top = Math.max(...counts.map(c => c.n));
      body = `<div class="bars">${counts.map(({ o, n }) => `<div class="bar ${n === top && n > 0 ? "top" : ""}">
        <span class="lbl">${esc(o)}</span><span class="pct">${Math.round(n / vals.length * 100)}%<small>${n}</small></span>
        <span class="track"><i style="width:${n / vals.length * 100}%"></i></span></div>`).join("")}</div>`;
    }
    return big ? `<article class="pj-card textured">${head}${body}</article>` : `<div class="qblock">${head}${body}</div>`;
  }).join("");
}

/* ---------- ניתוח לפי תחום עיסוק ---------- */
const DIMS = { role: ["תפקיד", 4], org: ["סוג ארגון", 5] };
function analysisHtml() {
  const a = ui.ana;
  const withData = S.stages.filter(s => respondents(s.id));
  const headHtml = `<div class="sec-title"><h2>ניתוח לפי תחום עיסוק</h2><span class="mono">Breakdown</span></div>`;
  if (!withData.length) return `<section class="ana">${headHtml}<div class="panel textured"><p class="empty">הניתוח יופיע כאן אחרי שיתקבלו תשובות.</p></div></section>`;
  if (!withData.some(s => s.id === a.stage)) a.stage = (withData.find(s => s.id === S.control.activeStage) || withData[withData.length - 1]).id;
  const st = stageById(a.stage);
  if (!st.questions.some(q => q.id === a.qid)) a.qid = st.questions[0].id;
  const q = st.questions.find(x => x.id === a.qid);
  const [dimLabel, idx] = DIMS[a.dim];
  let rows = rowsOf(st.id).filter(r => r[2] === q.id);
  const consentCount = rows.filter(r => r[6]).length;
  if (a.consent) rows = rows.filter(r => r[6]);
  const cols = q.type === "scale" ? [1, 2, 3, 4, 5] : q.options;
  const match = (v, c) => q.type === "scale" ? Number(v) === c : v === c;
  const groups = new Map();
  for (const r of rows) { const g = r[idx] || "לא צוין"; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(r[3]); }
  const ordered = [...groups.entries()].sort((x, y) => y[1].length - x[1].length);
  const rowHtml = (name, vals, cls) => {
    const n = vals.length, pcts = cols.map(c => n ? Math.round(vals.filter(v => match(v, c)).length / n * 100) : 0), top = Math.max(...pcts);
    const mean = q.type === "scale" && n ? (vals.map(Number).reduce((x, y) => x + y, 0) / n).toFixed(1) : "";
    return `<tr class="${cls}"><td class="g">${esc(name)}</td><td class="n">${n}</td>
      ${pcts.map(p => `<td><span class="heat ${p >= 55 ? "hot" : ""} ${p === top && p > 0 ? "top" : ""}" style="--p:${p}">${p}%</span></td>`).join("")}
      ${q.type === "scale" ? `<td class="mean">${mean}</td>` : ""}</tr>`;
  };
  const small = ordered.filter(([, v]) => v.length < 5).length;
  return `<section class="ana">${headHtml}<div class="panel textured">
    <div class="ana-controls">
      <label>שלב <select id="anaStage">${withData.map(s => `<option value="${esc(s.id)}" ${s.id === st.id ? "selected" : ""}>${pad(s.order)} · ${esc(s.title)}</option>`).join("")}</select></label>
      <label>שאלה <select id="anaQ">${st.questions.map((x, i) => `<option value="${esc(x.id)}" ${x.id === q.id ? "selected" : ""}>${i + 1}. ${esc(x.text.length > 48 ? x.text.slice(0, 46) + "…" : x.text)}</option>`).join("")}</select></label>
      <span class="seg" role="group" aria-label="פילוח לפי">${Object.entries(DIMS).map(([k, [l]]) => `<button data-ana-dim="${k}" aria-pressed="${a.dim === k}">לפי ${l}</button>`).join("")}</span>
      <label><input type="checkbox" id="anaConsent" ${a.consent ? "checked" : ""}> רק מי שהסכים להשתתף במחקר (${consentCount})</label>
    </div>
    <p class="ana-q">${esc(q.text)}</p>
    ${rows.length ? `<div class="ana-scroll"><table class="ana-table">
      <thead><tr><th>${dimLabel}</th><th>n</th>${cols.map(c => `<th class="opt">${esc(c)}</th>`).join("")}${q.type === "scale" ? "<th>ממוצע</th>" : ""}</tr></thead>
      <tbody>${ordered.map(([g, v]) => rowHtml(g, v, v.length < 5 ? "small" : "")).join("")}
        ${rowHtml("כל הקהל", rows.map(r => r[3]), "total")}</tbody></table></div>
      <p class="ana-note">כל שורה מסתכמת ל־100%. המסגרת מסמנת את התשובה השכיחה בכל קבוצה.${small ? ` קבוצות של פחות מ־5 משיבים מוצגות בהחלשה: המספרים שם לא יציבים.` : ""}</p>`
      : `<p class="empty">אין תשובות שעונות על הסינון הזה.</p>`}
  </div></section>`;
}

async function exportCsv() {
  const out = $("exportMsg");
  try {
    const d = await api("export");
    if (!d.ok) throw new Error(d.error);
    const cols = []; d.stages.forEach(s => s.questions.forEach(q => cols.push({ s, q })));
    const head = ["קוד", "שם מלא", "תפקיד", "תפקיד (פירוט)", "סוג ארגון", "סוג ארגון (פירוט)", "ארגון", "הסכמה למחקר", ...cols.map(({ s, q }) => `שלב ${s.order} · ${q.text}`)];
    const by = new Map(d.rows.map(r => [r[0] + "|" + r[1] + "|" + r[2], r[3]]));
    const body = d.attendees.map(a => [...a, ...cols.map(({ s, q }) => by.get(a[0] + "|" + s.id + "|" + q.id) ?? "")]);
    const csv = [head, ...body].map(r => r.map(v => { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(",")).join("\n");
    const url = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = "survey-responses.csv"; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { if (out) out.textContent = "הייצוא לא הצליח. נסו שוב או פתחו את הגיליון."; }
}

    <div class="wrap pj-foot"><span class="mono">${DEMO ? "Demo data · " : ""}Aggregated results · no names shown</span>
      <span class="mono num">Updated ${new Date(now()).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit", second: "2-digit" })} · <button class="pj-exit" data-act="exit-screen">לחדר הבקרה</button></span></div></div>`;
  if (sm.mode === "idle") dotTitle($("idleHead"), $("idleDots"), { maxWidth: 1100, size: 180, mobileSize: 90 });
  if (sm.mode === "live") { drawMatrix($("mxClock"), fmt(S.control.closesAt - now()), "clock"); drawMatrix($("mxCount"), String(respondents(st.id)), "count"); }
}

function tick() {
  if (!S) return;
  if (SCREEN) {
    const sm = screenMode();
    if (sm.mode === "live") drawMatrix($("mxClock"), fmt(S.control.closesAt - now()), "clock");
    const want = sm.mode + (sm.stage ? sm.stage.id : "");
    if (want !== lastScreenKey) render(); // הזמן נגמר: עוברים לתוצאות בלי לחכות לרענון
  } else {
    const el = $("pClock"); if (el) el.textContent = isOpen() ? fmt(S.control.closesAt - now()) : "—";
    if (el && !isOpen() && S.control.activeStage && el.dataset.was === "open") render();
    if (el) el.dataset.was = isOpen() ? "open" : "";
  }
}

/* ---------- תצוגת מטריצה: מספרים שבנויים מנקודות ---------- */
function drawMatrix(canvas, text, kind) {
  if (!canvas || !canvas.getContext) return;
  const box = canvas.parentElement.getBoundingClientRect();
  const H = Math.round(Math.min(innerHeight * (kind === "clock" ? .3 : .2), box.width * (kind === "clock" ? .36 : .4)));
  const step = Math.max(5, Math.round(H / 15)), r = step * .38, size = H;
  const font = `700 ${size}px "Rubik", "IBM Plex Sans Hebrew", Arial, sans-serif`;
  const off = document.createElement("canvas").getContext("2d"); off.font = font;
  const sample = kind === "clock" ? "00:00" : "0".repeat(Math.max(2, text.length));
  const W = Math.min(Math.ceil(box.width), Math.ceil(off.measureText(sample).width + step * 2));
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if (canvas.width !== W * dpr || canvas.height !== H * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px"; }
  const src = document.createElement("canvas"); src.width = W; src.height = H;
  const s = src.getContext("2d", { willReadFrequently: true });
  s.font = font; s.textBaseline = "middle"; s.textAlign = "right"; s.direction = "ltr"; s.fillStyle = "#000";
  s.fillText(text, W - step, H / 2 + size * .04);
  const data = s.getImageData(0, 0, W, H).data;
  const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const on = kind === "clock" && S && S.control.closesAt - now() < 30000 ? "#ff6b5e" : cssVar("--fg"), dim = cssVar("--line");
  for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step) {
    const lit = data[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128;
    ctx.fillStyle = lit ? on : dim; ctx.globalAlpha = lit ? 1 : .55;
    ctx.beginPath(); ctx.arc(x, y, lit ? r : r * .55, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- כותרת מנקודות (כמו באתר ההרשמה) ---------- */
function dotTitle(container, canvas, opts) {
  const ctx = canvas && canvas.getContext && canvas.getContext("2d"); if (!ctx) return;
  let dots = [], W = 0, H = 0, radius = 2.4, raf = 0;
  function build() {
    container.classList.add("dotted");
    const text = container.querySelector(".dot-text").textContent.trim();
    const maxW = Math.min(container.clientWidth - 8, opts.maxWidth);
    const step = maxW < 600 ? 5 : 8; radius = step * .36;
    let size = maxW < 600 ? opts.mobileSize : opts.size;
    const setFont = (c, sz) => { c.font = `700 ${sz}px "Rubik", "IBM Plex Sans Hebrew", Arial, sans-serif`; if ("letterSpacing" in c) c.letterSpacing = Math.round(sz * .04) + "px"; c.direction = "rtl"; };
    const off = document.createElement("canvas").getContext("2d"); setFont(off, size);
    while (off.measureText(text).width > maxW && size > 28) { size -= 2; setFont(off, size); }
    W = Math.ceil(maxW); H = Math.ceil(size * 1.25);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const src = document.createElement("canvas"); src.width = W; src.height = H;
    const s = src.getContext("2d", { willReadFrequently: true }); setFont(s, size); s.textAlign = "center"; s.textBaseline = "middle"; s.fillStyle = "#000";
    s.fillText(text, W / 2, H / 2 + size * .04);
    const data = s.getImageData(0, 0, W, H).data; dots = [];
    for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step)
      if (data[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128) dots.push({ x, y, seed: Math.random() * 1000 });
    cancelAnimationFrame(raf); draw(performance.now());
  }
  function draw(t) {
    if (!canvas.isConnected) return;
    const fg = cssVar("--fg"), accent = cssVar("--accent");
    ctx.clearRect(0, 0, W, H);
    for (const d of dots) {
      const g = reduceMotion ? 0 : Math.max(0, Math.sin(t / 900 + d.seed) - .985) * 60;
      ctx.fillStyle = g > .15 ? accent : fg; ctx.globalAlpha = g > .15 ? .55 + Math.min(1, g) * .45 : 1;
      ctx.beginPath(); ctx.arc(d.x, d.y, radius, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!reduceMotion) raf = requestAnimationFrame(draw);
  }
  const start = () => { try { build(); } catch (e) { container.classList.remove("dotted"); } };
  (document.fonts && document.fonts.load) ? document.fonts.load('700 100px "Rubik"', "אAI").then(start, start) : start();
}
addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => { lastScreenKey = ""; lastSig = ""; render(); }, 200); });

/* =========================================================
   מצב תצוגה: נתוני דוגמה כשאין עדיין כתובת סקריפט
   ========================================================= */
const MOCK = (() => {
  const roles = ["כתב", "עורך", "עורך ראשי", "מנהל במערכת חדשות", "חוקר/ת", "מפתח/ת"];
  const orgs = ["עיתון או קבוצת עיתונות", "גוף שידור ציבורי", "אתר חדשות או גוף עיתונות דיגיטלי", "מוסד אקדמי או מכון מחקר", "חברת טכנולוגיה או AI"];
  const stages = [
    { id: "s1", order: 1, title: "פתיחה: איפה אנחנו עומדים", durationMin: 5, questions: [
      { id: "q1", type: "choice", text: "באיזו תדירות אתם משתמשים בכלי בינה מלאכותית בעבודה?", options: ["כל יום", "כמה פעמים בשבוע", "לעיתים רחוקות", "אף פעם"] },
      { id: "q2", type: "scale", text: "עד כמה אתם סומכים על תוכן חדשותי שנכתב בעזרת AI?", min: "בכלל לא", max: "במידה רבה מאוד" }] },
    { id: "s2", order: 2, title: "אחרי הפאנל: אתיקה ואחריות", durationMin: 4, questions: [
      { id: "q1", type: "choice", text: "מי צריך לשאת באחריות לטעות בכתבה שנכתבה בעזרת AI?", options: ["העיתונאי/ת", "העורך/ת", "כלי התקשורת", "מפתחי הכלי"] },
      { id: "q2", type: "choice", text: "האם כלי תקשורת צריכים לסמן תוכן שנוצר בעזרת AI?", options: ["כן, תמיד", "רק כשה־AI מרכזי בתוכן", "לא צריך"] }] },
    { id: "s3", order: 3, title: "סיכום: מה לוקחים הביתה", durationMin: 5, questions: [
      { id: "q1", type: "choice", text: "איך הכנס השפיע על העמדה שלכם לגבי AI בעיתונאות?", options: ["נעשיתי אופטימי/ת יותר", "ללא שינוי", "נעשיתי חושש/ת יותר"] },
      { id: "q2", type: "scale", text: "באיזו מידה תשלבו AI בעבודה שלכם בשנה הקרובה?", min: "בכלל לא", max: "במידה רבה מאוד" }] },
  ];
  const people = Array.from({ length: 180 }, (_, i) => ({ code: "D" + (1000 + i), role: roles[i % roles.length], org: orgs[(i * 7) % orgs.length], ok: i % 5 ? 1 : 0 }));
  const weighted = (opts, i, k) => opts[Math.min(opts.length - 1, Math.floor(Math.abs(Math.sin(i * 12.9898 + k * 78.233)) * 43758.5453 % 1 * opts.length * .85))];
  // תשובות לדוגמה שמשתנות לפי תפקיד, כדי שיהיה מה לראות בפילוח
  const answer = (q, i, k) => {
    const bias = (i % roles.length) / roles.length;
    if (q.type === "scale") return Math.max(1, Math.min(5, Math.round(1.5 + bias * 3 + (Math.abs(Math.sin(i * 3.1 + k)) - .5) * 2)));
    return Math.abs(Math.sin(i * 7.7 + k)) < .45 ? q.options[Math.min(q.options.length - 1, Math.floor(bias * q.options.length))] : weighted(q.options, i, k);
  };
  const rows = [];
  people.slice(0, 142).forEach((p, i) => stages[0].questions.forEach((q, k) => rows.push([p.code, "s1", q.id, answer(q, i, k), p.role, p.org, p.ok])));
  const st = { serverNow: 0, attendeeCount: people.length, sheetUrl: "", stages, rows,
    control: { activeStage: "s1", closesAt: Date.now() - 60000, screen: "results", screenStage: "s1", history: { s1: Date.now() - 400000 } } };
  // בזמן ששלב פתוח, נכנסות תשובות לדוגמה כל כמה שניות
  setInterval(() => {
    const c = st.control; if (!(c.activeStage && Date.now() < c.closesAt)) return;
    const s = stages.find(x => x.id === c.activeStage), done = new Set(st.rows.filter(r => r[1] === s.id).map(r => r[0]));
    people.filter(p => !done.has(p.code)).slice(0, 3 + Math.floor(Math.random() * 6)).forEach((p) => {
      const i = people.indexOf(p); s.questions.forEach((q, k) => st.rows.push([p.code, s.id, q.id, answer(q, i, k), p.role, p.org, p.ok]));
    });
  }, 2000);
  return st;
})();
function mock(action, p) {
  return new Promise(res => setTimeout(() => {
    const st = MOCK, c = st.control, n = Date.now();
    if (action === "control") {
      if (p.op === "open") { const m = Math.max(1, Math.min(60, Number(p.minutes) || 5)); Object.assign(c, { activeStage: p.stage, closesAt: n + m * 60000, screen: "live", screenStage: p.stage }); c.history[p.stage] = n; }
      if (p.op === "extend") c.closesAt += 120000;
      if (p.op === "close") Object.assign(c, { closesAt: n, screen: "results", screenStage: c.activeStage });
      if (p.op === "screen") Object.assign(c, { screen: p.screen, screenStage: p.stage || "" });
    }
    if (action === "export") return res({ ok: true, attendees: [], rows: [], stages: [] });
    res({ ok: true, ...JSON.parse(JSON.stringify({ ...st, serverNow: n })) });
  }, 200));
}

/* ---------- הפעלה ---------- */
function setScreen(on) {
  SCREEN = on;
  document.body.classList.toggle("screen", on);
  $("foot").hidden = on;
  document.title = on ? "מסך הקרנה · סקר הקהל" : "חדר בקרה · סקר הקהל";
  lastSig = ""; lastScreenKey = ""; scrollTo(0, 0);
  if (S) render();
}
if (SCREEN) setScreen(true);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S) load(); });
if (DEMO) $("foot").insertAdjacentHTML("beforeend", `<div class="demo-note" style="margin-top:6px"><span class="mono">Demo mode</span> · נתוני דוגמה עד שתודבק כתובת הסקריפט</div>`);
load();
</script>
